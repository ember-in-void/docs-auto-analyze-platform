services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: nlp-platform-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nlp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nlp_pass}
      POSTGRES_DB: ${POSTGRES_DB:-nlp_platform}
    ports:
      - "${DB_PORT_HOST:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nlp_user -d nlp_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================
  # Go Backend
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nlp-platform-backend
    environment:
      APP_PORT: 8081
      POSTGRES_DSN: postgres://${POSTGRES_USER:-nlp_user}:${POSTGRES_PASSWORD:-nlp_pass}@postgres:5432/${POSTGRES_DB:-nlp_platform}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-for-diploma}
      NLP_SERVICE_URL: http://nlp-service:5000
    ports:
      - "${APP_PORT:-8081}:${APP_PORT:-8081}"
    depends_on:
      postgres:
        condition: service_healthy
      nlp-service:
        condition: service_started
    restart: unless-stopped

  # ==========================================
  # Python NLP Service
  # ==========================================
  nlp-service:
    build:
      context: ./nlp-service
      dockerfile: Dockerfile
    container_name: nlp-platform-ai
    deploy:
      resources:
        limits:
          memory: 4G
    expose:
      - "5000"
    restart: unless-stopped

  # ==========================================
  # React Frontend (dev mode via nginx in prod)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nlp-platform-frontend
    environment:
      VITE_API_URL: http://localhost:8081
    ports:
      - "${FRONTEND_PORT_HOST:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
